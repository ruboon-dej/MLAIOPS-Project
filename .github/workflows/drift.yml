name: drift

on:
  workflow_dispatch:
    inputs:
      current:
        description: path of the current data csv
        default: data/ed_timeseries.csv

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python3 src/drift.py --current "${{ inputs.current }}" --fail-on-retrain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report
          path: data/reports/drift.json
